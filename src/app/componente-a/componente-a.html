<div class="componente-a">

  <div class="superior">

    <input
      type="text"
      maxlength="7"
      [value]="hexadecimalEscrito"
      (input)="cambiarHexadecimal($event)"
    >

    <button (click)="mostrarColor()">
      Show
    </button>

  </div>

  <div class="inferior">

    <div class="rgb">

      <app-componente-b
        letra="R"
        [valor]="colorService.r()"
        (cambioValor)="cambiarR($event)">
      </app-componente-b>

      <app-componente-b
        letra="G"
        [valor]="colorService.g()"
        (cambioValor)="cambiarG($event)">
      </app-componente-b>

      <app-componente-b
        letra="B"
        [valor]="colorService.b()"
        (cambioValor)="cambiarB($event)">
      </app-componente-b>

    </div>

    <app-componente-c
      [r]="colorService.r()"
      [g]="colorService.g()"
      [b]="colorService.b()">
    </app-componente-c>

  </div>

</div>
